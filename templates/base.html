{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="fr" data-theme="{{ site_settings.color_theme }}" data-font="{{ site_settings.font_theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="{{ site_settings.google_fonts_url }}" rel="stylesheet">
    {% tailwind_css %}
</head>
<body class="min-h-screen flex flex-col bg-paper text-ink">
    {% include "includes/navbar.html" %}
    <main class="flex-1 w-full max-w-3xl mx-auto px-4 py-12">
        {% block content %}{% endblock %}
    </main>
    {% include "includes/footer.html" %}
</body>
</html>
